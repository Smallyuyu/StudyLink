<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Dashboard', ~{::main})}">
<main class="container page-shell">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <p class="small-label">Welcome back</p>
            <h1 class="h2" th:text="${user.displayName}">Student</h1>
            <p class="text-secondary" th:text="${user.department}">Department</p>
        </div>
        <a class="btn btn-primary" th:href="@{/profile}">Edit profile</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <section class="panel h-100">
                <h2 class="h5">Your Courses</h2>
                <div th:if="${#sets.isEmpty(courses)}" class="empty-state">No courses yet.</div>
                <ul th:unless="${#sets.isEmpty(courses)}" class="list-group list-group-flush">
                    <li th:each="course : ${courses}" class="list-group-item px-0">
                        <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.code + ' ' + course.name}">Course</a>
                    </li>
                </ul>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="panel h-100">
                <h2 class="h5">Your Groups</h2>
                <div th:if="${#lists.isEmpty(memberships)}" class="empty-state">No group membership yet.</div>
                <ul th:unless="${#lists.isEmpty(memberships)}" class="list-group list-group-flush">
                    <li th:each="membership : ${memberships}" class="list-group-item px-0">
                        <a th:href="@{/groups/{id}(id=${membership.studyGroup.id})}" th:text="${membership.studyGroup.name}">Group</a>
                        <span class="badge text-bg-light" th:text="${membership.role}">MEMBER</span>
                    </li>
                </ul>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="panel h-100">
                <h2 class="h5">Recent Requests</h2>
                <div th:if="${#lists.isEmpty(requests)}" class="empty-state">No join requests sent.</div>
                <ul th:unless="${#lists.isEmpty(requests)}" class="list-group list-group-flush">
                    <li th:each="request : ${requests}" class="list-group-item px-0">
                        <span th:text="${request.studyGroup.name}">Group</span>
                        <span class="badge text-bg-secondary" th:text="${request.status}">PENDING</span>
                    </li>
                </ul>
            </section>
        </div>
    </div>
</main>
</html>
