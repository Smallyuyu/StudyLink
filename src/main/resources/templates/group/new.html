<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('New Group', ~{::main})}">
<main class="container page-shell">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <section class="panel">
                <p class="small-label">Create study group</p>
                <h1 class="h3 mb-3">New group</h1>
                <form th:action="@{/groups}" th:object="${studyGroupForm}" method="post" class="vstack gap-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <label class="form-label" for="courseId">Course</label>
                        <select class="form-select" id="courseId" th:field="*{courseId}" required>
                            <option value="">Choose a course</option>
                            <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.code + ' ' + course.name}">Course</option>
                        </select>
                        <div class="text-danger small" th:errors="*{courseId}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="name">Name</label>
                        <input class="form-control" id="name" th:field="*{name}" required>
                        <div class="text-danger small" th:errors="*{name}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="description">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                        <div class="text-danger small" th:errors="*{description}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="maxMembers">Max members</label>
                        <input class="form-control" id="maxMembers" th:field="*{maxMembers}" type="number" min="2" max="12">
                        <div class="text-danger small" th:errors="*{maxMembers}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="targetGoals">Target goals</label>
                        <input class="form-control" id="targetGoals" th:field="*{targetGoals}" placeholder="python, portfolio, interviews">
                        <div class="text-danger small" th:errors="*{targetGoals}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="preferredTimes">Preferred times</label>
                        <input class="form-control" id="preferredTimes" th:field="*{preferredTimes}" placeholder="monday, night">
                        <div class="text-danger small" th:errors="*{preferredTimes}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">Create group</button>
                </form>
            </section>
        </div>
    </div>
</main>
</html>
