<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Groups', ~{::main})}">
<main class="container page-shell">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <p class="small-label">Study groups</p>
            <h1 class="h2">Groups</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/groups/new}">Create group</a>
    </div>
    <div th:if="${#lists.isEmpty(groups)}" class="empty-state">No groups yet.</div>
    <div class="row g-3">
        <div th:each="group : ${groups}" class="col-md-6">
            <section class="panel h-100">
                <div class="d-flex justify-content-between">
                    <span class="small-label" th:text="${group.course.code}">Course</span>
                    <span class="badge text-bg-light" th:text="${group.status}">OPEN</span>
                </div>
                <h2 class="h5" th:text="${group.name}">Group</h2>
                <p class="text-secondary" th:text="${group.description}">Description</p>
                <div class="small text-secondary mb-3">
                    <span th:text="${group.memberCount()}">1</span>/<span th:text="${group.maxMembers}">4</span> members
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/groups/{id}(id=${group.id})}">View</a>
                    <form th:if="${group.owner.id == currentUser.id && group.status.name() != 'CLOSED'}"
                          th:action="@{/groups/{id}/close(id=${group.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-secondary" type="submit">Close</button>
                    </form>
                    <form th:if="${group.owner.id == currentUser.id && group.status.name() == 'CLOSED'}"
                          th:action="@{/groups/{id}/reopen(id=${group.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Reopen</button>
                    </form>
                    <form th:if="${group.owner.id == currentUser.id}"
                          th:action="@{/groups/{id}/delete(id=${group.id})}" method="post"
                          onsubmit="return confirm('Delete this group?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
</html>
