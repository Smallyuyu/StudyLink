<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Register', ~{::main})}">
<main class="container page-shell">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <section class="panel">
                <p class="small-label">New account</p>
                <h1 class="h3 mb-3">Register</h1>
                <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="vstack gap-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" th:field="*{email}" type="email" required>
                        <div class="text-danger small" th:errors="*{email}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="displayName">Display name</label>
                        <input class="form-control" id="displayName" th:field="*{displayName}" required>
                        <div class="text-danger small" th:errors="*{displayName}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" th:field="*{password}" type="password" required>
                        <div class="text-danger small" th:errors="*{password}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">Create account</button>
                </form>
            </section>
        </div>
    </div>
</main>
</html>
