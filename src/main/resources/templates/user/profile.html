<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Profile', ~{::main})}">
<main class="container page-shell">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <section class="panel">
                <p class="small-label">Learner profile</p>
                <h1 class="h3 mb-3">Profile</h1>
                <form th:action="@{/profile}" th:object="${profileForm}" method="post" class="vstack gap-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <label class="form-label" for="displayName">Display name</label>
                        <input class="form-control" id="displayName" th:field="*{displayName}" required>
                        <div class="text-danger small" th:errors="*{displayName}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="department">Department</label>
                        <input class="form-control" id="department" th:field="*{department}">
                        <div class="text-danger small" th:errors="*{department}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="skillTagsCustom">Skill tags</label>
                        <div class="tag-editor" data-tag-editor>
                            <input type="hidden" th:field="*{skillTags}" data-tag-value>
                            <div class="tag-editor__menu" aria-label="Suggested skill tags">
                                <button class="tag-option" type="button" data-tag-option="python">Python</button>
                                <button class="tag-option" type="button" data-tag-option="sql">SQL</button>
                                <button class="tag-option" type="button" data-tag-option="java">Java</button>
                                <button class="tag-option" type="button" data-tag-option="spring">Spring</button>
                                <button class="tag-option" type="button" data-tag-option="backend">Backend</button>
                                <button class="tag-option" type="button" data-tag-option="frontend">Frontend</button>
                                <button class="tag-option" type="button" data-tag-option="design">Design</button>
                                <button class="tag-option" type="button" data-tag-option="figma">Figma</button>
                                <button class="tag-option" type="button" data-tag-option="research">Research</button>
                                <button class="tag-option" type="button" data-tag-option="accessibility">Accessibility</button>
                                <button class="tag-option" type="button" data-tag-option="algorithms">Algorithms</button>
                                <button class="tag-option" type="button" data-tag-option="data">Data</button>
                                <button class="tag-option" type="button" data-tag-option="analytics">Analytics</button>
                                <button class="tag-option" type="button" data-tag-option="visualization">Visualization</button>
                                <button class="tag-option" type="button" data-tag-option="product">Product</button>
                                <button class="tag-option" type="button" data-tag-option="presentation">Presentation</button>
                            </div>
                            <div class="tag-editor__selected" data-tag-selected aria-label="Selected skill tags" aria-live="polite"></div>
                            <div class="input-group input-group-sm tag-editor__custom">
                                <input class="form-control" id="skillTagsCustom" data-tag-custom type="text" autocomplete="off">
                                <button class="btn btn-outline-secondary" type="button" data-tag-add>Add tag</button>
                            </div>
                        </div>
                        <div class="text-danger small" th:errors="*{skillTags}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="availableTimesCustom">Available times</label>
                        <div class="tag-editor" data-tag-editor>
                            <input type="hidden" th:field="*{availableTimes}" data-tag-value>
                            <div class="tag-editor__menu" aria-label="Available weekdays and times">
                                <button class="tag-option" type="button" data-tag-option="monday">Monday</button>
                                <button class="tag-option" type="button" data-tag-option="tuesday">Tuesday</button>
                                <button class="tag-option" type="button" data-tag-option="wednesday">Wednesday</button>
                                <button class="tag-option" type="button" data-tag-option="thursday">Thursday</button>
                                <button class="tag-option" type="button" data-tag-option="friday">Friday</button>
                                <button class="tag-option" type="button" data-tag-option="saturday">Saturday</button>
                                <button class="tag-option" type="button" data-tag-option="sunday">Sunday</button>
                                <button class="tag-option" type="button" data-tag-option="morning">Morning</button>
                                <button class="tag-option" type="button" data-tag-option="afternoon">Afternoon</button>
                                <button class="tag-option" type="button" data-tag-option="night">Night</button>
                            </div>
                            <div class="tag-editor__selected" data-tag-selected aria-label="Selected available times" aria-live="polite"></div>
                            <div class="input-group input-group-sm tag-editor__custom">
                                <input class="form-control" id="availableTimesCustom" data-tag-custom type="text" autocomplete="off">
                                <button class="btn btn-outline-secondary" type="button" data-tag-add>Add tag</button>
                            </div>
                        </div>
                        <div class="text-danger small" th:errors="*{availableTimes}"></div>
                    </div>
                    <div>
                        <label class="form-label" for="learningGoals">Learning goals</label>
                        <textarea class="form-control" id="learningGoals" th:field="*{learningGoals}" rows="4"></textarea>
                        <div class="text-danger small" th:errors="*{learningGoals}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">Save profile</button>
                </form>
            </section>
        </div>
    </div>
    <script th:src="@{/js/tag-input.js}"></script>
</main>
</html>
